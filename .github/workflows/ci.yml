name: CI
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-release.py
      - run: python scripts/test_release.py
      - run: dotnet restore StructuredJson.sln --locked-mode
      - run: dotnet build StructuredJson.sln -c Release --no-restore
      - run: dotnet test StructuredJson.Tests/StructuredJson.Tests.csproj -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults
      - run: dotnet pack StructuredJson/StructuredJson.csproj -c Release --no-build --no-restore -o artifacts
      - run: python scripts/package-smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nuget-packages
          path: artifacts/*nupkg
          if-no-files-found: error
