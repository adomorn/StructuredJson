name: SonarCloud analysis
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  analysis:
    # Fork PRs do not receive secrets; required correctness checks live in CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: coverage==7.10.7'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet tool restore
      - name: Analyze and enforce quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN"
          dotnet sonarscanner begin \
            /k:"adomorn_StructuredJson" \
            /o:"adomorn" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.python.coverage.reportPaths="TestResults/python/coverage.xml" \
            /d:sonar.python.version=3.12 \
            /d:sonar.test.inclusions="StructuredJson.Tests/**/*.cs,**/test_*.py" \
            /d:sonar.exclusions="docs/**,benchmarks/**,**/*.png,artifacts/**,TestResults/**" \
            /d:sonar.coverage.exclusions="examples/**,Example.cs" \
            /d:sonar.qualitygate.wait=true
          dotnet restore StructuredJson.sln --locked-mode
          dotnet build StructuredJson.sln -c Release --no-restore --no-incremental
          dotnet test StructuredJson.Tests/StructuredJson.Tests.csproj -c Release -f net8.0 --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          dotnet pack StructuredJson/StructuredJson.csproj -c Release --no-build --no-restore -o artifacts
          python -m coverage run scripts/test_release.py
          python -m coverage run scripts/validate-release.py
          python -m coverage run scripts/release-notes.py
          python -m coverage run scripts/package-smoke.py
          python -m coverage combine
          python -m coverage xml
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
