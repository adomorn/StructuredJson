name: SonarCloud analysis
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  analysis:
    # Fork PRs do not receive secrets; required correctness checks live in CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet tool restore
      - name: Analyze and enforce quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN"
          dotnet sonarscanner begin /k:"adomorn_StructuredJson" /o:"adomorn" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" /d:sonar.exclusions="docs/**,benchmarks/**" /d:sonar.qualitygate.wait=true
          dotnet restore StructuredJson.sln --locked-mode
          dotnet build StructuredJson.sln -c Release --no-restore --no-incremental
          dotnet test StructuredJson.Tests/StructuredJson.Tests.csproj -c Release -f net8.0 --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
